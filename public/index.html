<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Minecraft Standalone Renderer · MCP</title>
<link rel="stylesheet" href="/style.css" />
<script type="importmap">{"imports":{"three":"/vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading" class="loading">
  <div class="loader-ring"></div>
  <div class="loading-title">正在编译世界几何</div>
  <div class="loading-sub" id="loadingSub">连接渲染器…</div>
</div>

<header class="brand">
  <div class="brand-mark">MC</div>
  <div>
    <div class="brand-title">Aperture <span>Standalone</span></div>
    <div class="brand-sub">Minecraft Java World · GPU Renderer · MCP</div>
  </div>
</header>

<div class="hud-left">
  <div class="world-name" id="worldName">—</div>
  <div class="world-meta" id="worldMeta">—</div>
</div>

<aside class="panel">
  <div class="panel-scroll">
    <section class="group">
      <div class="group-head"><span>运镜 CAMERA</span><span class="tag" id="modeTag">FREE</span></div>
      <div class="tabs">
        <button class="tab active" data-tab="free">自由</button>
        <button class="tab" data-tab="orbit">轨道</button>
        <button class="tab" data-tab="path">路径</button>
      </div>

      <div class="tab-page active" id="tab-free">
        <label class="field-label">位置 X / Y / Z</label>
        <div class="row three"><input id="fx" type="number" step="0.1" /><input id="fy" type="number" step="0.1" /><input id="fz" type="number" step="0.1" /></div>
        <label class="field-label">看向 X / Y / Z</label>
        <div class="row three"><input id="tx" type="number" step="0.1" /><input id="ty" type="number" step="0.1" /><input id="tz" type="number" step="0.1" /></div>
        <label class="field-label">视场角 FOV <span class="val" id="fovVal">70°</span></label>
        <input id="fov" type="range" min="20" max="110" step="1" value="70" />
        <button class="btn primary wide" id="applyFree">应用自由相机</button>
        <div class="hint">拖动画面环顾 · WASD/QE 飞行 · Shift 加速</div>
      </div>

      <div class="tab-page" id="tab-orbit">
        <label class="field-label">环绕中心 X / Y / Z</label>
        <div class="row three"><input id="ox" type="number" step="0.5" /><input id="oy" type="number" step="0.5" /><input id="oz" type="number" step="0.5" /></div>
        <div class="row two">
          <div><label class="field-label">距离</label><input id="od" type="number" step="1" /></div>
          <div><label class="field-label">方位角</label><input id="oa" type="number" step="1" /></div>
        </div>
        <div class="row two">
          <div><label class="field-label">仰角</label><input id="oe" type="number" step="1" /></div>
          <div><label class="field-label">FOV</label><input id="of" type="number" step="1" /></div>
        </div>
        <label class="check"><input id="oauto" type="checkbox" /> 自动环绕</label>
        <label class="field-label">速度 <span class="val" id="ospeedVal">6°/s</span></label>
        <input id="ospeed" type="range" min="0" max="40" step="1" value="6" />
        <button class="btn primary wide" id="applyOrbit">应用轨道相机</button>
        <div class="hint">左键拖动旋转 · 滚轮缩放</div>
      </div>

      <div class="tab-page" id="tab-path">
        <div class="path-list" id="pathList"><div class="empty">暂无关键帧</div></div>
        <div class="row two">
          <button class="btn" id="addKey">＋ 当前机位</button>
          <button class="btn danger" id="clearPath">清空</button>
        </div>
        <div class="row two">
          <div><label class="field-label">时长 s</label><input id="pathDuration" type="number" min="1" step="1" value="8" /></div>
          <div><label class="field-label">循环</label><label class="check inline"><input id="pathLoop" type="checkbox" checked /> Loop</label></div>
        </div>
        <div class="row two">
          <button class="btn primary" id="playPath">▶ 播放</button>
          <button class="btn" id="pausePath">⏸ 暂停</button>
        </div>
        <label class="field-label">时间轴 <span class="val" id="pathTime">0.0s</span></label>
        <input id="pathSeek" type="range" min="0" max="1000" step="1" value="0" />
        <div class="hint">关键帧包含位置、目标点、FOV。MCP 可直接注入完整路径。</div>
      </div>
    </section>

    <section class="group">
      <div class="group-head"><span>光影 SHADING</span><span class="tag" id="presetTag">CINEMATIC</span></div>
      <label class="field-label">渲染预设</label>
      <select id="preset">
        <option value="cinematic">Cinematic · 电影</option>
        <option value="realistic">Realistic · 写实</option>
        <option value="vanilla">Vanilla · 原味</option>
        <option value="performance">Performance · 性能</option>
        <option value="custom">Custom · 自定义</option>
      </select>
      <label class="check"><input id="shadowToggle" type="checkbox" checked /> 太阳阴影 / 阴影贴图</label>
      <label class="check"><input id="bloomToggle" type="checkbox" checked /> Bloom 泛光</label>
      <label class="check"><input id="raysToggle" type="checkbox" checked /> 体积光 / 屏幕光束</label>
      <label class="field-label">曝光 <span class="val" id="exposureVal">1.05</span></label>
      <input id="exposure" type="range" min="0.4" max="2.2" step="0.01" value="1.05" />
      <label class="field-label">时间 <span class="val" id="timeVal">12:00</span></label>
      <input id="timeOfDay" type="range" min="0" max="24" step="0.1" value="12" />
      <label class="field-label">雾密度 <span class="val" id="fogVal">0.0016</span></label>
      <input id="fog" type="range" min="0" max="0.02" step="0.0001" value="0.0016" />
    </section>

    <section class="group">
      <div class="group-head"><span>渲染统计 STATS</span><span class="tag green" id="fpsTag">— FPS</span></div>
      <div class="stat-grid">
        <div><span>三角面</span><b id="stTris">—</b></div>
        <div><span>Draw Calls</span><b id="stCalls">—</b></div>
        <div><span>区块网格</span><b id="stMeshes">—</b></div>
        <div><span>分辨率</span><b id="stRes">—</b></div>
      </div>
      <div class="camera-readout" id="camReadout">—</div>
      <button class="btn wide" id="downloadShot">下载当前画面 PNG</button>
    </section>
  </div>
</aside>

<div class="bottom-bar">
  <span class="dot"></span><span id="statusText">初始化中</span>
  <span class="spacer"></span>
  <span class="mcp">MCP · stdio</span>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
